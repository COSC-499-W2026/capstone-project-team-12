name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hunt
          POSTGRES_PASSWORD: hunt
          POSTGRES_DB: hunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hunt -d hunt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://hunt:hunt@localhost:5432/hunt_test

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . ../../tests ../../utils

      - name: Ruff format check
        run: ruff format --check . ../../tests ../../utils

      - name: Mypy
        run: mypy  # files come from pyproject.toml

      # --graph redraws the (git-ignored) file first, so --check only fails on a broken rule
      - name: Dependency rules
        run: python ../../utils/dep_graph.py --graph --check

      - name: OpenAPI document can be generated
        run: python ../../utils/export_openapi.py

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: Alembic check (models match the migrations)
        run: alembic check

      - name: Migrations can be undone and redone
        run: alembic downgrade base && alembic upgrade head

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing
