name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, ARM64]
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Create a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: src/backend

      - name: Generate the OpenAPI document
        run: python ../../utils/export_openapi.py
        working-directory: src/backend

      - name: Generate the dependency graph
        run: python utils/dep_graph.py --graph

      - name: Build the site
        run: |
          mkdir site
          cp .github/pages/*.html site/
          cp docs/api/openapi.json docs/architecture/dependency-graph.md site/

      # netlify-cli@27 requires Node 22.13+. The runner image is not assumed to have it.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Netlify secrets
        if: github.ref == 'refs/heads/main'
        run: |
          missing=0
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Missing repository secret NETLIFY_AUTH_TOKEN. Create a Netlify personal access token and add it as an Actions repository secret."
            missing=1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Missing repository secret NETLIFY_SITE_ID. Create a Netlify site and add its site ID as an Actions repository secret."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy the site to Netlify
        if: github.ref == 'refs/heads/main'
        run: npx --yes netlify-cli@27 deploy --dir=site --prod --no-build --message "${{ github.sha }}"
