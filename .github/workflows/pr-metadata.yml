name: PR metadata

# Fills in the PR sidebar so nobody has to do it by hand:
# assignee, reviewers (review cycle from the team contract), labels and milestone.
# It only adds things. Labels or reviewers someone set by hand are never removed,
# except one case: when a second teammate is added as an assignee (two people wrote
# the PR together), a review request to that teammate is taken back.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, assigned, unassigned]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  metadata:
    # PRs from forks get a read-only token, so skip them
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const author = pr.user.login;

            // Review cycle from the team contract
            const REVIEWERS = {
              miakwong: ["EddyTian58", "fabihafifa"],
              typpsii: ["EddyTian58", "fabihafifa"],
              fabihafifa: ["miakwong", "typpsii"],
              EddyTian58: ["miakwong", "typpsii"],
            };
            const OWNER_LABEL = {
              miakwong: "owner:Mia",
              typpsii: "owner:Kaedyn",
              fabihafifa: "owner:Fabiha",
              EddyTian58: "owner:Eddy",
            };
            // From the title prefix, e.g. "feat: add users" -> feature
            const TYPE_LABEL = {
              feat: "feature",
              fix: "bug",
              docs: "docs",
              test: "test",
              chore: "chore",
              ci: "chore",
              style: "chore",
              refactor: "chore",
            };
            // Labels copied from the linked issue
            const FROM_ISSUE = /^(area:.+|owner:.+|interface|M\d+)$/;

            const labels = new Set();

            const type = (pr.title.match(/^(\w+)(\([^)]*\))?!?:/) || [])[1];
            if (TYPE_LABEL[type]) labels.add(TYPE_LABEL[type]);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            if (files.some((f) => f.filename.startsWith("tests/"))) labels.add("test");

            // "Closes #12", "Fixes #12", "Resolves #12" or "Part of #8" in the description
            const linked = new Set(
              [...(pr.body || "").matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|part of)\s+#(\d+)/gi)]
                .map((m) => Number(m[1])),
            );
            let milestone = null;
            for (const number of linked) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
                if (issue.pull_request) continue; // a PR, not an issue
                for (const label of issue.labels) {
                  const name = typeof label === "string" ? label : label.name;
                  if (FROM_ISSUE.test(name)) labels.add(name);
                }
                if (!milestone && issue.milestone) milestone = issue.milestone.number;
              } catch (error) {
                core.warning(`Could not read issue #${number}: ${error.message}`);
              }
            }
            if (linked.size === 0) {
              core.warning('No "Closes #N" or "Part of #N" in the description, so no labels were copied from an issue.');
            }

            // Team issues have no owner label, so fall back to the PR author
            if (![...labels].some((name) => name.startsWith("owner:")) && OWNER_LABEL[author]) {
              labels.add(OWNER_LABEL[author]);
            }

            const current = new Set(pr.labels.map((label) => label.name));
            const missing = [...labels].filter((name) => !current.has(name));
            if (missing.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: missing });
            }

            if (pr.assignees.length === 0) {
              await github.rest.issues.addAssignees({ owner, repo, issue_number: pr.number, assignees: [author] });
            }

            if (milestone && !pr.milestone) {
              await github.rest.issues.update({ owner, repo, issue_number: pr.number, milestone });
            }

            // Reviewers. One author: the review cycle from the contract.
            // Two teammates as assignees (a PR written together): the other two review it.
            const team = Object.keys(REVIEWERS);
            const authors = new Set(
              [author, ...pr.assignees.map((a) => a.login)].filter((login) => team.includes(login)),
            );
            const reviewers = authors.size >= 2
              ? team.filter((login) => !authors.has(login))
              : (REVIEWERS[author] || []);

            const action = context.payload.action;
            const shouldRequest = !pr.draft && (
              ["opened", "reopened", "ready_for_review"].includes(action) ||
              (["assigned", "unassigned"].includes(action) && authors.size >= 2)
            );
            if (shouldRequest) {
              // a co-author can't review their own PR
              const pending = (pr.requested_reviewers || []).map((u) => u.login);
              const coAuthors = pending.filter((login) => authors.has(login));
              if (coAuthors.length) {
                await github.rest.pulls.removeRequestedReviewers({
                  owner, repo, pull_number: pr.number, reviewers: coAuthors,
                });
              }
              const toRequest = reviewers.filter((login) => !pending.includes(login));
              if (toRequest.length) {
                await github.rest.pulls.requestReviewers({
                  owner, repo, pull_number: pr.number, reviewers: toRequest,
                });
              }
            }

            core.info(`labels added: ${missing.join(", ") || "none"}; linked issues: ${[...linked].join(", ") || "none"}`);
