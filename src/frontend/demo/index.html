<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#291334" />
    <title>Hunt Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">Hunt <span>demo</span></a>
      <nav id="nav"></nav>
    </header>
    <main id="app" aria-live="polite"></main>
    <div id="toast" role="status" hidden></div>
    <dialog id="confirm">
      <form method="dialog">
        <p class="bi-ja" id="confirm-ja"></p>
        <p class="bi-en" id="confirm-en"></p>
        <div class="row">
          <button value="cancel" class="btn ghost">Cancel</button>
          <button value="ok" class="btn danger">Confirm</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
