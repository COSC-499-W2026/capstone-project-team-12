[project]
name = "hunt-api"
version = "0.1.0"
description = "Backend API for the Japanese Scavenger Hunt Game (COSC 499, Team 12)"
requires-python = ">=3.11,<3.12"
# pinned versions live in requirements.txt
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.15.1",
    "easyocr>=1.7.2",
    "torch>=2.8,<2.10",  # CPU-only build, see requirements.txt; EasyOCR 1.7.2 needs torch.quantization
    "torchvision>=0.23,<0.25",
]

[project.optional-dependencies]
# pinned versions live in requirements-dev.txt
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",  # Starlette TestClient backend (plain httpx is deprecated)
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["../../tests/backend", "../../tests/utils"]
pythonpath = [".", "../../utils"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "../../utils"]

[[tool.mypy.overrides]]
module = ["easyocr"]
ignore_missing_imports = true  # EasyOCR ships no type information
